<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Взлётка — молодой, кепка козырьком вперёд, новая одежда -->
  <rect width="100" height="100" fill="#0e0c09"/>
  <rect x="0" y="60" width="100" height="40" fill="#1a1410"/>
  <!-- Шея -->
  <rect x="42" y="62" width="16" height="20" fill="#d4a070"/>
  <!-- Голова — поменьше, молодая -->
  <ellipse cx="50" cy="46" rx="20" ry="22" fill="#dcb080"/>
  <!-- Кепка — козырёк вперёд (модный) -->
  <path d="M30 30 Q50 22 70 30 L70 36 L30 36 Z" fill="#0a0805"/>
  <ellipse cx="50" cy="36" rx="36" ry="4" fill="#0a0805"/>
  <!-- Брови — нахальные -->
  <path d="M37 47 L46 45" stroke="#0a0805" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M54 45 L63 47" stroke="#0a0805" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Глаза — большие -->
  <circle cx="41" cy="52" r="2" fill="#0a0805"/>
  <circle cx="59" cy="52" r="2" fill="#0a0805"/>
  <!-- Нос -->
  <line x1="50" y1="52" x2="50" y2="60" stroke="#a07a40" stroke-width="2"/>
  <!-- Усмешка -->
  <path d="M44 64 Q50 68 56 64" stroke="#0a0805" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Телефон в руке -->
  <rect x="68" y="78" width="8" height="14" rx="1" fill="#1a1410" stroke="#e8a44a" stroke-width="1"/>
  <rect x="69" y="79" width="6" height="10" fill="#0a0805"/>
  <!-- Новая олимпийка -->
  <rect x="30" y="78" width="38" height="14" fill="#0a0805"/>
  <line x1="36" y1="78" x2="36" y2="92" stroke="#fff" stroke-width="2"/>
  <line x1="40" y1="78" x2="40" y2="92" stroke="#fff" stroke-width="2"/>
  <line x1="44" y1="78" x2="44" y2="92" stroke="#fff" stroke-width="2"/>
  <!-- Логотип Adidas -->
  <circle cx="60" cy="86" r="4" fill="#e8a44a" opacity=".7"/>
  <!-- Цепочка -->
  <path d="M38 78 Q42 76 46 78" stroke="#e8a44a" stroke-width="1.5" fill="none"/>
</svg>
