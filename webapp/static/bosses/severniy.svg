<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Северный — суровый мужик с кепкой, бритая голова, жёсткий взгляд -->
  <rect width="100" height="100" fill="#0e0c09"/>
  <rect x="0" y="60" width="100" height="40" fill="#1a1410"/>
  <!-- Шея -->
  <rect x="40" y="62" width="20" height="20" fill="#c49060"/>
  <!-- Голова -->
  <ellipse cx="50" cy="44" rx="22" ry="26" fill="#d4a070"/>
  <!-- Кепка -->
  <path d="M28 30 Q50 18 72 30 L72 36 L28 36 Z" fill="#0a0805"/>
  <rect x="22" y="34" width="56" height="6" fill="#0a0805"/>
  <rect x="22" y="34" width="56" height="2" fill="#e8a44a" opacity=".6"/>
  <!-- Козырёк -->
  <ellipse cx="50" cy="36" rx="32" ry="3" fill="#0a0805"/>
  <!-- Брови — суровые -->
  <path d="M36 44 L46 42" stroke="#0a0805" stroke-width="3" stroke-linecap="round"/>
  <path d="M54 42 L64 44" stroke="#0a0805" stroke-width="3" stroke-linecap="round"/>
  <!-- Глаза — прищур -->
  <line x1="36" y1="50" x2="46" y2="50" stroke="#0a0805" stroke-width="3" stroke-linecap="round"/>
  <line x1="54" y1="50" x2="64" y2="50" stroke="#0a0805" stroke-width="3" stroke-linecap="round"/>
  <!-- Нос -->
  <path d="M48 50 L50 60 L52 50" stroke="#a07a40" stroke-width="2" fill="none"/>
  <!-- Рот — жёсткая линия -->
  <line x1="42" y1="64" x2="58" y2="64" stroke="#0a0805" stroke-width="3" stroke-linecap="round"/>
  <!-- Шрам -->
  <line x1="62" y1="46" x2="68" y2="56" stroke="#a04030" stroke-width="2" stroke-linecap="round"/>
  <!-- Adidas полосы на одежде -->
  <rect x="30" y="78" width="40" height="14" fill="#0a0805"/>
  <line x1="36" y1="78" x2="36" y2="92" stroke="#fff" stroke-width="2"/>
  <line x1="40" y1="78" x2="40" y2="92" stroke="#fff" stroke-width="2"/>
  <line x1="44" y1="78" x2="44" y2="92" stroke="#fff" stroke-width="2"/>
  <line x1="56" y1="78" x2="56" y2="92" stroke="#fff" stroke-width="2"/>
  <line x1="60" y1="78" x2="60" y2="92" stroke="#fff" stroke-width="2"/>
  <line x1="64" y1="78" x2="64" y2="92" stroke="#fff" stroke-width="2"/>
  <!-- Золотой акцент на одежде -->
  <line x1="28" y1="84" x2="72" y2="84" stroke="#e8a44a" stroke-width="1" opacity=".5"/>
</svg>
