  <path d="M36 45 Q41 43 46 45" stroke="#0a0805" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M54 45 Q59 43 64 45" stroke="#0a0805" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Глаза — прищуренные с блеском -->
  <path d="M37 52 Q41 54 45 52" stroke="#0a0805" stroke-width="2" fill="none"/>
  <path d="M55 52 Q59 54 63 52" stroke="#0a0805" stroke-width="2" fill="none"/>
  <!-- Блик в глазах -->
  <circle cx="41" cy="51" r="0.8" fill="#fff"/>
  <circle cx="59" cy="51" r="0.8" fill="#fff"/>
  <!-- Нос -->
  <path d="M48 50 L50 60 L52 50" stroke="#a07a40" stroke-width="2" fill="none"/>
  <!-- Загадочная полуулыбка -->
  <path d="M44 66 Q50 70 56 66" stroke="#0a0805" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Бритый подбородок -->
  <!-- Adidas-куртка -->
  <rect x="30" y="78" width="40" height="14" fill="#0a0805"/>
  <line x1="36" y1="78" x2="36" y2="92" stroke="#fff" stroke-width="2"/>
  <line x1="40" y1="78" x2="40" y2="92" stroke="#fff" stroke-width="2"/>
  <line x1="44" y1="78" x2="44" y2="92" stroke="#fff" stroke-width="2"/>
  <line x1="56" y1="78" x2="56" y2="92" stroke="#fff" stroke-width="2"/>
  <line x1="60" y1="78" x2="60" y2="92" stroke="#fff" stroke-width="2"/>
  <line x1="64" y1="78" x2="64" y2="92" stroke="#fff" stroke-width="2"/>
  <!-- Руки в карманах -->
  <path d="M30 86 L26 92 L26 100 L36 100 L36 92 Z" fill="#0a0805"/>
  <path d="M70 86 L74 92 L74 100 L64 100 L64 92 Z" fill="#0a0805"/>
