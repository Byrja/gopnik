  <rect x="0" y="60" width="100" height="40" fill="#1a1410"/>
  <!-- Шея -->
  <rect x="42" y="62" width="16" height="20" fill="#c49060"/>
  <!-- Голова — обычная -->
  <ellipse cx="50" cy="44" rx="21" ry="24" fill="#d4a070"/>
  <!-- Кепка-восьмиклинка -->
  <path d="M30 30 Q50 20 70 30 L70 36 L30 36 Z" fill="#0a0805"/>
  <path d="M30 36 L20 32 L20 38 L30 38 Z" fill="#0a0805"/>
  <path d="M70 36 L80 32 L80 38 L70 38 Z" fill="#0a0805"/>
  <rect x="24" y="34" width="52" height="3" fill="#e8a44a" opacity=".5"/>
