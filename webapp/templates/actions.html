{% extends "base.html" %}
{% block title %}Дела — Пацанский Ход{% endblock %}
{% block content %}
<div class="app">
    <header class="hero">
        <img class="banner" src="/static/banner_pacanskiy.png" alt="ПАЦАНСКИЙ ХОД">
        <p class="sub" id="energy-line">Энергия: ...</p>
    </header>

    <section class="actions">
        <h2>👊 Действия</h2>
        <div class="action-grid">
            <button class="action-tile" data-action="work">
                <img class="action-tile-img" src="/static/icons/rabota.svg">
                <div class="action-tile-name">РАБОТА</div>
                <div class="action-tile-cost">10⚡ · 80-120₽</div>
            </button>
            <button class="action-tile" data-action="turnik">
                <img class="action-tile-img" src="/static/icons/turnik.svg">
                <div class="action-tile-name">ТУРНИК</div>
                <div class="action-tile-cost">8⚡ · +1💪</div>
            </button>
            <button class="action-tile" data-action="bazar">
                <img class="action-tile-img" src="/static/icons/bazar.svg">
                <div class="action-tile-name">БАЗАР</div>
                <div class="action-tile-cost">6⚡ · +1🗣</div>
            </button>
            <button class="action-tile" data-action="mutka">
                <img class="action-tile-img" src="/static/icons/mutka.svg">
                <div class="action-tile-name">МУТКА</div>
                <div class="action-tile-cost">12⚡ · 50-200₽</div>
            </button>
            <button class="action-tile" data-action="nychka">
                <img class="action-tile-img" src="/static/icons/nychka.svg">
                <div class="action-tile-name">НЫЧКА</div>
                <div class="action-tile-cost" id="nychka-cost">раз в 6ч</div>
            </button>
            <button class="action-tile" data-action="chaynaya">
                <img class="action-tile-img" src="/static/icons/chaynaya.svg">
                <div class="action-tile-name">ЧАЙНАЯ</div>
                <div class="action-tile-cost">750₽ · +⚡</div>
            </button>
        </div>

        <h2>🥊 Движение</h2>
        <button class="action-tile big" data-action="gop" id="btn-gop">
            <img class="action-tile-img" src="/static/icons/dvizhenie.svg">
            <div class="action-tile-name">ДВИЖЕНИЕ</div>
            <div class="action-tile-cost">PvP-бой · 15⚡</div>
        </button>
    </section>

    <div id="toast" class="toast hidden"></div>

    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <img class="nav-ico" src="/static/icons/nav-dvor.svg" alt="">
            <span>ДВОР</span>
        </a>
        <a href="/quests" class="nav-item">
            <img class="nav-ico" src="/static/icons/nav-quests.svg" alt="">
            <span>ЗАДАНИЯ</span>
        </a>
        <a href="/bosses" class="nav-item">
            <img class="nav-ico" src="/static/icons/nav-bosses.svg" alt="">
            <span>БОССЫ</span>
        </a>
        <a href="/clan" class="nav-item">
            <img class="nav-ico" src="/static/icons/nav-clan.svg" alt="">
            <span>БРАТВА</span>
        </a>
    </nav>
</div>
{% endblock %}
{% block scripts %}
<script>
    loadProfileForActions();
    bindActions();
    bindNychkaCountdown();
</script>
{% endblock %}
