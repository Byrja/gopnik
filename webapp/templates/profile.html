{% extends "base.html" %}
{% block title %}Профиль — Пацанский Ход{% endblock %}
{% block content %}
<div class="app">
    <header class="hero">
        <h1 class="drip-title">👤 ПРОФИЛЬ</h1>
        <p class="sub">Твои статы и район</p>
    </header>

    <section id="profile" class="profile">
        <div class="loader">Грузим профиль...</div>
    </section>

    <section class="district-section">
        <h2 class="section-title drip-title-sm">📍 Район</h2>
        <div id="district-list" class="district-list">
            <div class="loader">Грузим районы...</div>
        </div>
    </section>

    <div class="profile-back">
        <a href="/" class="big-cta profile-back-btn">
            <span class="big-cta-text">← На Двор</span>
        </a>
    </div>

    <div id="toast" class="toast hidden"></div>

    {% include "partials/nav.html" %}
</div>
{% endblock %}
{% block scripts %}
<script>
    loadProfile();
</script>
{% endblock %}
